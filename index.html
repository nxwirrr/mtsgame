<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5f2ea" />
<title>Dictamen · juego de cátedra</title>
<style>
/* ============================================================
   DISEÑO — tokens
   Paleta clara, alto contraste, pensada para leer párrafos
   largos en un celular y para proyectar en un aula.
   ============================================================ */
:root{
  --bg:#f5f2ea;
  --surface:#ffffff;
  --surface-2:#faf8f3;
  --ink:#17151f;
  --ink-2:#3d3850;
  --muted:#726c85;
  --line:#e6e0d4;
  --line-2:#d5cdbc;

  --docente:#4b39d8;
  --docente-soft:#ece9ff;
  --catedra:#b45309;
  --catedra-soft:#fdf1e0;
  --equipo:#0f766e;
  --equipo-soft:#e2f4f1;

  --si:#15803d;
  --si-soft:#e7f6ec;
  --obs:#b45309;
  --obs-soft:#fdf1e0;
  --no:#be123c;
  --no-soft:#fdeaef;

  --r-lg:20px;
  --r-md:14px;
  --r-sm:10px;
  --shadow:0 1px 2px rgba(23,21,31,.06), 0 8px 24px rgba(23,21,31,.07);
  --shadow-sm:0 1px 2px rgba(23,21,31,.07);
  --bar:64px; /* alto de la barra de demo */
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em;font-weight:800}
h1{font-size:26px}
h2{font-size:20px}
h3{font-size:16px;letter-spacing:-.01em}
p{margin:0}

/* ---------- estructura ---------- */
#app{min-height:100dvh;display:flex;flex-direction:column}
.screen{
  flex:1;
  width:min(680px,100%);
  margin:0 auto;
  padding:14px 16px calc(var(--bar) + 28px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:14px;
}
.screen.center{justify-content:center}

/* ---------- barra superior ---------- */
.topbar{
  display:flex;align-items:center;gap:10px;justify-content:space-between;
  padding:2px 0 6px;
}
.rolechip{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:6px 11px;border-radius:999px;border:1px solid transparent;
}
.rolechip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.rolechip.docente{color:var(--docente);background:var(--docente-soft);border-color:#d9d3ff}
.rolechip.catedra{color:var(--catedra);background:var(--catedra-soft);border-color:#f3e0c6}
.rolechip.estudiante{color:var(--equipo);background:var(--equipo-soft);border-color:#c6e7e1}
.codechip{
  font-size:13px;font-weight:700;color:var(--muted);
  letter-spacing:.14em;font-variant-numeric:tabular-nums;
}
.codechip b{color:var(--ink);letter-spacing:.2em}

/* ---------- tarjetas ---------- */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  padding:18px;
  box-shadow:var(--shadow-sm);
}
.card.flat{box-shadow:none;background:var(--surface-2)}
.card.pad-sm{padding:14px}
.kicker{
  font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:7px;
}
.lead{color:var(--ink-2);font-size:15px}
.muted{color:var(--muted);font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.divider{height:1px;background:var(--line);margin:2px 0}

/* ---------- botones ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;padding:14px 18px;border-radius:var(--r-md);
  font-weight:700;font-size:16px;letter-spacing:-.01em;
  background:var(--ink);color:#fff;
  transition:transform .06s ease, opacity .15s ease;
  width:100%;
}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line-2)}
.btn.soft{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.btn.docente{background:var(--docente)}
.btn.catedra{background:var(--catedra)}
.btn.equipo{background:var(--equipo)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px;width:auto;border-radius:var(--r-sm)}
.btn.link{background:none;color:var(--muted);min-height:40px;font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* ---------- formularios ---------- */
label.field{display:block}
.label{
  display:block;font-size:12px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin:0 0 7px;
}
input[type=text],input[type=tel],textarea,select{
  width:100%;background:#fff;border:1.5px solid var(--line-2);
  border-radius:var(--r-md);padding:14px;outline:none;
  transition:border-color .15s ease, box-shadow .15s ease;
}
input:focus,textarea:focus,select:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(23,21,31,.08)}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.code-input{
  text-align:center;font-size:34px;font-weight:800;letter-spacing:.34em;
  text-transform:uppercase;padding:16px 10px 16px 20px;
}
.pin-input{text-align:center;font-size:26px;font-weight:800;letter-spacing:.5em;padding:14px 6px 14px 22px}

/* ---------- fragmento ---------- */
.pregunta{
  background:var(--surface-2);border:1px solid var(--line);
  border-left:4px solid var(--docente);
  border-radius:var(--r-sm);padding:12px 14px;
}
.pregunta .kicker{margin-bottom:4px}
.fragmento{
  font-size:17px;line-height:1.62;color:var(--ink);
  hyphens:auto;
}

/* ---------- opciones ---------- */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
  border:1.5px solid var(--line-2);background:#fff;border-radius:var(--r-md);
  padding:15px 14px;transition:border-color .12s ease, background .12s ease;
}
.opt .badge{
  flex:0 0 auto;width:28px;height:28px;border-radius:8px;
  display:grid;place-items:center;font-weight:800;font-size:14px;
  background:var(--surface-2);color:var(--muted);border:1px solid var(--line);
}
.opt .txt{font-weight:700;letter-spacing:-.01em}
.opt[aria-pressed=true]{border-width:2px;padding:14px 13px}
.opt.si[aria-pressed=true]{border-color:var(--si);background:var(--si-soft)}
.opt.si[aria-pressed=true] .badge{background:var(--si);color:#fff;border-color:var(--si)}
.opt.obs[aria-pressed=true]{border-color:var(--obs);background:var(--obs-soft)}
.opt.obs[aria-pressed=true] .badge{background:var(--obs);color:#fff;border-color:var(--obs)}
.opt.no[aria-pressed=true]{border-color:var(--no);background:var(--no-soft)}
.opt.no[aria-pressed=true] .badge{background:var(--no);color:#fff;border-color:var(--no)}

.tag{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:800;letter-spacing:.02em;
  padding:5px 10px;border-radius:999px;border:1px solid transparent;white-space:nowrap;
}
.tag.si{color:var(--si);background:var(--si-soft);border-color:#c7e6d2}
.tag.obs{color:var(--obs);background:var(--obs-soft);border-color:#f3e0c6}
.tag.no{color:var(--no);background:var(--no-soft);border-color:#f6ccd7}
.tag.gris{color:var(--muted);background:var(--surface-2);border-color:var(--line)}

/* ---------- cronómetro ---------- */
.timer{display:flex;align-items:center;gap:12px}
.timer .num{
  font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;min-width:76px;
}
.timer.urgente .num{color:var(--no)}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ink);transition:width .95s linear}
.timer.urgente .bar > i{background:var(--no)}

/* ---------- listas ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{
  display:flex;align-items:center;gap:12px;
  border:1px solid var(--line);border-radius:var(--r-md);
  background:#fff;padding:12px 14px;
}
.item .name{font-weight:700}
.row.wrap .name{white-space:nowrap}
.item .sub{font-size:13px;color:var(--muted)}
.avatar{
  flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  font-weight:800;font-size:13px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);
}
.avatar.e1{background:#e8ecff;border-color:#cdd6ff;color:#3346c7}
.avatar.e2{background:#e2f4f1;border-color:#c1e6df;color:#0f766e}
.avatar.e3{background:#fdf1e0;border-color:#f2ddbf;color:#b45309}
.avatar.e4{background:#fdeaef;border-color:#f5ccd8;color:#be123c}

/* ---------- puntajes ---------- */
.scorebtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sbtn{
  border:1.5px solid var(--line-2);background:#fff;border-radius:var(--r-md);
  min-height:52px;font-weight:800;font-size:17px;
  display:grid;place-items:center;transition:all .12s ease;
}
.sbtn small{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.sbtn[aria-pressed=true]{background:var(--catedra);border-color:var(--catedra);color:#fff}
.sbtn[aria-pressed=true] small{color:#fff;opacity:.85}

.rank{display:flex;flex-direction:column;gap:8px}
.rank .item .pos{font-weight:800;color:var(--muted);width:22px;text-align:center}
.rank .item .pts{font-weight:800;font-variant-numeric:tabular-nums;font-size:18px}
.rank .item.yo{border-color:var(--equipo);background:var(--equipo-soft)}

.big-code{
  text-align:center;padding:22px 16px;
  background:var(--ink);color:#fff;border-radius:var(--r-lg);
}
.big-code .val{font-size:48px;font-weight:800;letter-spacing:.22em;line-height:1.1}
.big-code .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.65;font-weight:700}
.big-code .pin{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18);font-size:13px;opacity:.8}
.big-code .pin b{font-size:19px;letter-spacing:.18em;opacity:1}

.wait{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  text-align:center;padding:34px 18px;
}
.pulse{width:52px;height:52px;border-radius:50%;background:var(--ink);opacity:.12;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.82);opacity:.1}50%{transform:scale(1);opacity:.22}}

.progress-dots{display:flex;gap:6px;justify-content:center}
.progress-dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.progress-dots i.on{background:var(--ink)}
.progress-dots i.now{background:var(--docente);transform:scale(1.35)}

.check{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;border:1.5px solid var(--line-2);border-radius:var(--r-md);background:#fff;text-align:left;width:100%}
.check[aria-pressed=true]{border-color:var(--docente);background:var(--docente-soft)}
.check .box{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line-2);background:#fff;display:grid;place-items:center;font-size:13px;color:#fff;font-weight:800;margin-top:1px}
.check[aria-pressed=true] .box{background:var(--docente);border-color:var(--docente)}
.check .t{font-weight:700;font-size:15px}
.check .d{font-size:13px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface-2);padding:5px;border-radius:var(--r-md);border:1px solid var(--line)}
.seg button{padding:10px 6px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}

.aviso{
  display:flex;gap:10px;align-items:flex-start;
  background:var(--catedra-soft);border:1px solid #f3e0c6;color:#7c3d06;
  border-radius:var(--r-md);padding:12px 14px;font-size:13px;line-height:1.45;
}

/* ---------- barra de demo (solo etapa 1) ---------- */
.demobar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(23,21,31,.96);
  backdrop-filter:saturate(140%) blur(8px);
  color:#fff;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:8px;
}
.demobar .lbl{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.55;padding-right:2px;line-height:1.2;max-width:74px}
.demobar .segs{display:flex;gap:6px;flex:1}
.demobar button{
  flex:1;padding:10px 6px;border-radius:10px;font-size:13px;font-weight:700;
  background:rgba(255,255,255,.1);color:#fff;
}
.demobar button[aria-pressed=true]{background:#fff;color:var(--ink)}
.demobar button.reset{flex:0 0 auto;background:none;opacity:.55;font-size:12px;text-decoration:underline;padding:10px 4px}

@media (min-width:560px){
  h1{font-size:30px}
  .screen{padding-left:20px;padding-right:20px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="demobar" id="demobar"></div>
<script>
/* ============================================================================
   ETAPA 1 — Esqueleto navegable, SIN base de datos.

   Todo lo que acá se guarda en la variable `P` ("la partida") es, en la
   Etapa 2, lo que va a vivir en el pizarrón compartido (Firestore). El
   código está escrito para que ese cambio sea reemplazar cómo se lee y se
   escribe `P`, sin tocar las pantallas.

   Por ahora vive solo en la memoria de esta pestaña: si recargás, se borra.
   La barra negra de abajo es SOLO de esta etapa: sirve para ver las tres
   interfaces de la misma partida desde un único celular.
   ============================================================================ */

/* ---------------------------------------------------------------- DATOS --- */

// Las 3 opciones son siempre las mismas. Lo que cambia por tipo de actividad
// es el criterio de puntaje que ve cátedra (ver TIPOS).
const OPCIONES = [
  { id: "aprueba",       letra: "A", clase: "si",  texto: "Aprueba" },
  { id: "observaciones", letra: "B", clase: "obs", texto: "Aprueba con observaciones" },
  { id: "no_aprueba",    letra: "C", clase: "no",  texto: "No aprueba" }
];
const opcionPorId = (id) => OPCIONES.find((o) => o.id === id) || null;

// Criterios PROVISORIOS. En la Etapa 7 se editan desde la app, no desde acá.
const TIPOS = {
  fragmento: {
    nombre: "Evaluación de fragmento",
    corto: "Fragmento",
    consigna: "Leé el fragmento y dictaminá.",
    criterio: {
      2: "Fundamenta con criterios del texto y justifica el fallo.",
      1: "Identifica el problema pero la justificación es general.",
      0: "No justifica o la justificación no se apoya en el fragmento."
    }
  },
  estado: {
    nombre: "Estado de la cuestión",
    corto: "Estado",
    consigna: "¿El párrafo construye estado de la cuestión?",
    criterio: {
      2: "Detecta si hay articulación entre autores y recorte al problema.",
      1: "Nota que algo falta pero no precisa qué.",
      0: "Confunde listar autores con construir estado de la cuestión."
    }
  },
  objetivos: {
    nombre: "Objetivos",
    corto: "Objetivos",
    consigna: "¿El objetivo está bien formulado?",
    criterio: {
      2: "Evalúa verbo, alcance y correspondencia con el problema.",
      1: "Revisa la forma pero no la correspondencia con el problema.",
      0: "Juzga por gusto o por redacción, sin criterio metodológico."
    }
  }
};
const TIPO_IDS = Object.keys(TIPOS);

// Biblioteca de fragmentos. En la Etapa 3 se guarda de verdad y se reusa
// entre partidas; acá arranca con dos ejemplos para poder navegar.
let BIBLIOTECA = [
  {
    id: "f1", tipo: "estado",
    titulo: "Representaciones sociales · versión lista",
    pregunta: "¿Cómo influyen las representaciones sociales del rol docente en el malestar de maestras rurales de primaria?",
    texto: "Diversos autores han definido las representaciones sociales. Moscovici (1961) señala que son sistemas de valores, ideas y prácticas. Jodelet (1986) agrega que permiten interpretar el mundo y orientar la conducta. Abric (1994) distingue núcleo central y elementos periféricos. En educación, estas nociones han sido ampliamente utilizadas para estudiar creencias, identidades y prácticas escolares en distintos niveles y contextos."
  },
  {
    id: "f2", tipo: "estado",
    titulo: "Representaciones sociales · versión recortada",
    pregunta: "¿Cómo influyen las representaciones sociales del rol docente en el malestar de maestras rurales de primaria?",
    texto: "Las representaciones sociales (Moscovici, 1961; Jodelet, 1986) se entienden aquí como sistemas de sentido que organizan la percepción del oficio. No se toma el concepto de modo genérico: se lo recorta al núcleo “buena maestra / escuela posible” en contexto rural (Abric, 1994). Ese recorte permite leer el malestar no como rasgo individual, sino como tensión entre la representación del rol y las condiciones reales de la escuela del interior."
  },
  {
    id: "f3", tipo: "objetivos",
    titulo: "Objetivo general · primera versión",
    pregunta: "Proyecto sobre malestar docente en escuelas rurales.",
    texto: "Objetivo general: conocer la realidad de las maestras rurales de la provincia para mejorar su bienestar y aportar al sistema educativo."
  }
];

const NOMBRES_DEMO = ["Ana","Belén","Cami","Dana","Euge","Flor","Guada","Ine","Juli","Ken","Lu","Mai","Nico","Orne","Pau","Rocío"];

/* --------------------------------------------------------------- ESTADO --- */

// P = la partida (el futuro "pizarrón compartido"). null = no hay partida.
let P = null;

// U = lo de cada celular: quién soy y qué estoy escribiendo. Esto NO se comparte.
let U = {
  pantalla: "home",   // home | crear
  rol: null,          // docente | catedra | estudiante
  miEquipo: null,     // id del equipo que me tocó (solo estudiantes)
  codigoDraft: "",
  pinDraft: "",
  modoStaff: false,
  error: "",
  tipoNuevo: null,    // formulario de fragmento nuevo abierto
  nuevo: { titulo: "", pregunta: "", texto: "" }
};

let cfg = { tipo: "estado", segundos: 90, elegidos: [] };
let tick = null;
let demoTimers = [];

/* ------------------------------------------------------------ UTILIDADES --- */

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
const uid = () => Math.random().toString(36).slice(2, 8);
const azar = (n) => Math.floor(Math.random() * n);

function codigoSala() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return Array.from({ length: 4 }, () => chars[azar(chars.length)]).join("");
}
function mmss(seg) {
  const s = Math.max(0, Math.round(seg));
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
function limpiarTimers() {
  clearInterval(tick); tick = null;
  demoTimers.forEach(clearTimeout); demoTimers = [];
}

/* --------------------------------------------------- LÓGICA DE LA PARTIDA --- */

function crearPartida() {
  const equipos = [1, 2, 3, 4].map((n) => ({ id: "e" + n, nombre: "Equipo " + n, integrantes: [] }));
  // Sorteo: en la Etapa 2 pasa de verdad, a medida que la gente entra.
  const gente = NOMBRES_DEMO.slice(0, 11);
  gente.forEach((nom, i) => equipos[i % 4].integrantes.push(nom));

  P = {
    codigo: codigoSala(),
    pin: String(1000 + azar(9000)),
    tipo: cfg.tipo,
    segundos: cfg.segundos,
    rondas: cfg.elegidos.slice(),
    rondaIndex: 0,
    fase: "lobby",              // lobby | ronda | puntuando | revelado | fin
    finRonda: null,
    equipos,
    respuestas: {},             // respuestas[rondaIndex][equipoId]
    puntajes: {}                // puntajes[rondaIndex][equipoId]
  };
  U.rol = "docente";
  U.miEquipo = "e2";            // en la demo, "yo estudiante" soy del Equipo 2
  U.pantalla = "partida";
  render();
}

const fragmentoActual = () => BIBLIOTECA.find((f) => f.id === P.rondas[P.rondaIndex]) || null;
const respuestasRonda = () => (P.respuestas[P.rondaIndex] ||= {});
const puntajesRonda = () => (P.puntajes[P.rondaIndex] ||= {});
const respuestaDe = (eq) => respuestasRonda()[eq] || null;

function totalDe(equipoId) {
  return Object.values(P.puntajes).reduce((acc, r) => acc + (r[equipoId] ?? 0), 0);
}
function ranking() {
  return P.equipos
    .map((e) => ({ ...e, total: totalDe(e.id) }))
    .sort((a, b) => b.total - a.total || a.nombre.localeCompare(b.nombre));
}
function respondidos() {
  return P.equipos.filter((e) => respuestaDe(e.id)?.enviada).length;
}
function puntuados() {
  const p = puntajesRonda();
  return P.equipos.filter((e) => p[e.id] !== undefined).length;
}

function iniciarRonda() {
  limpiarTimers();
  P.fase = "ronda";
  P.finRonda = Date.now() + P.segundos * 1000;
  P.respuestas[P.rondaIndex] = {};
  P.puntajes[P.rondaIndex] = {};

  tick = setInterval(latido, 250);
  // Los otros equipos "responden" solos, para poder ver cómo se llena la
  // pantalla del docente. En la Etapa 2 esto lo hace gente de verdad.
  P.equipos.filter((e) => e.id !== U.miEquipo).forEach((e) => {
    const cuando = 4000 + azar(Math.max(3000, P.segundos * 1000 - 12000));
    demoTimers.push(setTimeout(() => {
      if (P.fase !== "ronda") return;
      respuestasRonda()[e.id] = {
        opcion: OPCIONES[azar(3)].id,
        justificacion: "El párrafo enumera autores pero no articula la teoría con el problema de investigación.",
        enviada: true
      };
      render();
    }, cuando));
  });
  render();
}

function latido() {
  if (!P || P.fase !== "ronda") return;
  const restante = (P.finRonda - Date.now()) / 1000;
  pintarTimer(restante);
  if (restante <= 0) cerrarRonda();
}

function cerrarRonda() {
  limpiarTimers();
  // Al vencer el tiempo se envía lo que haya, aunque esté incompleto.
  P.equipos.forEach((e) => {
    const r = respuestasRonda()[e.id];
    if (!r) respuestasRonda()[e.id] = { opcion: null, justificacion: "", enviada: true, vencida: true };
    else if (!r.enviada) { r.enviada = true; r.vencida = true; }
  });
  P.fase = "puntuando";
  P.finRonda = null;
  render();
}

function siguienteRonda() {
  if (P.rondaIndex + 1 < P.rondas.length) { P.rondaIndex++; P.fase = "lobby"; }
  else P.fase = "fin";
  render();
}

/* ------------------------------------------------------------- PEDACITOS --- */

function topbar() {
  if (!P) return "";
  const etiqueta = { docente: "Docente", catedra: "Cátedra", estudiante: equipoMio()?.nombre || "Estudiante" }[U.rol];
  return `<div class="topbar">
    <span class="rolechip ${U.rol}"><i class="dot"></i>${esc(etiqueta)}</span>
    <span class="codechip">SALA <b>${esc(P.codigo)}</b></span>
  </div>`;
}

const equipoMio = () => P.equipos.find((e) => e.id === U.miEquipo);

function pasos() {
  const n = P.rondas.length;
  return `<div class="progress-dots">${
    P.rondas.map((_, i) => `<i class="${i < P.rondaIndex ? "on" : i === P.rondaIndex ? "now" : ""}"></i>`).join("")
  }</div><p class="muted" style="text-align:center">Ronda ${P.rondaIndex + 1} de ${n}</p>`;
}

function timerHTML() {
  const restante = P.finRonda ? (P.finRonda - Date.now()) / 1000 : P.segundos;
  const pct = Math.max(0, Math.min(100, (restante / P.segundos) * 100));
  const urg = restante <= 15 ? " urgente" : "";
  return `<div class="timer${urg}" id="timer">
    <span class="num" id="tnum">${mmss(restante)}</span>
    <span class="bar"><i id="tbar" style="width:${pct}%"></i></span>
  </div>`;
}
function pintarTimer(restante) {
  const num = document.getElementById("tnum"), bar = document.getElementById("tbar"), box = document.getElementById("timer");
  if (!num) return;
  num.textContent = mmss(restante);
  bar.style.width = Math.max(0, Math.min(100, (restante / P.segundos) * 100)) + "%";
  box.classList.toggle("urgente", restante <= 15);
}

function fragmentoHTML(f, conPregunta = true) {
  if (!f) return `<div class="card"><p class="muted">Sin fragmento cargado.</p></div>`;
  return `<div class="card stack">
    <div>
      <p class="kicker">${esc(TIPOS[P.tipo].nombre)}</p>
      <h2>${esc(f.titulo)}</h2>
    </div>
    ${conPregunta && f.pregunta ? `<div class="pregunta">
      <p class="kicker">Pregunta de investigación</p>
      <p class="lead">${esc(f.pregunta)}</p>
    </div>` : ""}
    <p class="fragmento">${esc(f.texto)}</p>
  </div>`;
}

function tagOpcion(id, vencida) {
  const o = opcionPorId(id);
  if (!o) return `<span class="tag gris">${vencida ? "Sin responder" : "—"}</span>`;
  return `<span class="tag ${o.clase}">${esc(o.texto)}</span>`;
}

function rankingHTML(destacarMio) {
  return `<div class="rank">${ranking().map((e, i) => `
    <div class="item ${destacarMio && e.id === U.miEquipo ? "yo" : ""}">
      <span class="pos">${i + 1}</span>
      <span class="avatar ${e.id}">${esc(e.nombre.replace("Equipo ", "E"))}</span>
      <span class="name">${esc(e.nombre)}</span>
      <span class="spacer"></span>
      <span class="pts">${e.total}</span>
    </div>`).join("")}</div>`;
}

function panelPuntaje(editable) {
  const crit = TIPOS[P.tipo].criterio;
  const pts = puntajesRonda();
  return `
  <div class="card stack">
    <div>
      <p class="kicker">Criterio · ${esc(TIPOS[P.tipo].nombre)}</p>
      <div class="stack-sm" style="margin-top:6px">
        ${[2,1,0].map((n) => `<p class="muted"><b style="color:var(--ink)">+${n}</b> · ${esc(crit[n])}</p>`).join("")}
      </div>
    </div>
    <p class="muted" style="font-size:12px">Criterio provisorio — se edita desde la app en la Etapa 7.</p>
  </div>
  ${P.equipos.map((e) => {
    const r = respuestaDe(e.id) || {};
    const p = pts[e.id];
    return `<div class="card stack">
      <div class="row wrap">
        <span class="avatar ${e.id}">${esc(e.nombre.replace("Equipo ", "E"))}</span>
        <span class="name">${esc(e.nombre)}</span>
        <span class="spacer"></span>
        ${tagOpcion(r.opcion, r.vencida)}
      </div>
      <p class="lead">${r.justificacion ? esc(r.justificacion) : `<span class="muted">Sin justificación${r.vencida ? " (se venció el tiempo)" : ""}.</span>`}</p>
      ${editable ? `<div class="scorebtns">
        ${[2,1,0].map((n) => `<button class="sbtn" data-a="puntuar" data-eq="${e.id}" data-n="${n}" aria-pressed="${p === n}">+${n}</button>`).join("")}
      </div>` : `<p class="muted">${p === undefined ? "Sin puntuar todavía" : "Puntaje: +" + p}</p>`}
    </div>`;
  }).join("")}`;
}

function esperando(titulo, texto) {
  return `<div class="card wait">
    <div class="pulse"></div>
    <h2>${esc(titulo)}</h2>
    <p class="lead muted">${esc(texto)}</p>
  </div>`;
}

/* ---------------------------------------------------------------- RENDER --- */

function render() {
  const activo = document.activeElement;
  const foco = activo && activo.id ? { id: activo.id, pos: activo.selectionStart } : null;

  let html;
  if (U.pantalla === "crear") html = vistaCrear();
  else if (U.pantalla === "home" || !P) html = vistaHome();
  else html = { docente: vistaDocente, catedra: vistaCatedra, estudiante: vistaEstudiante }[U.rol]();
  $("#app").innerHTML = html;

  if (foco) {
    const el = document.getElementById(foco.id);
    if (el) { el.focus(); try { el.setSelectionRange(foco.pos, foco.pos); } catch (_) {} }
  }
  renderDemobar();
}

function renderDemobar() {
  const roles = [["docente", "Docente"], ["catedra", "Cátedra"], ["estudiante", "Estudiante"]];
  $("#demobar").innerHTML = !P || U.pantalla !== "partida"
    ? `<span class="lbl" style="max-width:none">Etapa 1 · esqueleto sin base de datos</span>`
    : `<span class="lbl">Ver como</span>
       <span class="segs">${roles.map(([r, t]) =>
         `<button data-a="rol" data-r="${r}" aria-pressed="${U.rol === r}">${t}</button>`).join("")}</span>
       <button class="reset" data-a="reset">Reiniciar</button>`;
}

/* ---------------------------------------------------------------- EVENTOS --- */

document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-a]");
  if (!b) return;
  const a = b.dataset.a;

  // --- inicio ---
  if (a === "toggle-staff") { U.modoStaff = !U.modoStaff; U.error = ""; return render(); }
  if (a === "ir-crear") { U.pantalla = "crear"; U.error = ""; return render(); }
  if (a === "home") { U.pantalla = "home"; U.rol = null; U.error = ""; U.modoStaff = false; return render(); }
  if (a === "entrar") {
    const cod = (U.codigoDraft || "").trim().toUpperCase();
    if (!P) { U.error = "Todavía no hay ninguna partida. En esta etapa la sala vive solo en esta pestaña: creá una desde “Crear una partida”."; return render(); }
    if (cod !== P.codigo) { U.error = "No encontramos esa sala. Revisá el código."; return render(); }
    if (U.modoStaff) {
      if (U.pinDraft.trim() !== P.pin) { U.error = "PIN incorrecto."; return render(); }
      U.rol = "catedra";
    } else {
      U.rol = "estudiante";
      U.miEquipo = U.miEquipo || "e2";
    }
    U.error = ""; U.pantalla = "partida"; return render();
  }

  // --- armado de la partida ---
  if (a === "tipo") { cfg.tipo = b.dataset.t; cfg.elegidos = []; return render(); }
  if (a === "tiempo") { cfg.segundos = Number(b.dataset.s); return render(); }
  if (a === "elegir") {
    const id = b.dataset.f;
    cfg.elegidos = cfg.elegidos.includes(id) ? cfg.elegidos.filter((x) => x !== id) : [...cfg.elegidos, id];
    return render();
  }
  if (a === "nuevo-frag") { U.tipoNuevo = cfg.tipo; U.nuevo = { titulo: "", pregunta: "", texto: "" }; return render(); }
  if (a === "cancelar-frag") { U.tipoNuevo = null; return render(); }
  if (a === "guardar-frag") {
    if (!U.nuevo.texto.trim()) return;
    const f = { id: uid(), tipo: cfg.tipo, titulo: U.nuevo.titulo.trim() || "Fragmento sin título",
                pregunta: U.nuevo.pregunta.trim(), texto: U.nuevo.texto.trim() };
    BIBLIOTECA.push(f); cfg.elegidos.push(f.id); U.tipoNuevo = null;
    return render();
  }
  if (a === "crear") return crearPartida();

  // --- control de la partida ---
  if (a === "iniciar") return iniciarRonda();
  if (a === "cortar") return cerrarRonda();
  if (a === "revelar") { P.fase = "revelado"; return render(); }
  if (a === "siguiente") return siguienteRonda();
  if (a === "puntuar") { puntajesRonda()[b.dataset.eq] = Number(b.dataset.n); return render(); }

  // --- estudiante ---
  if (a === "opcion") {
    const r = (respuestasRonda()[U.miEquipo] ||= { opcion: null, justificacion: "", enviada: false });
    if (r.enviada) return;
    r.opcion = b.dataset.o;
    return render();
  }
  if (a === "enviar") {
    const r = respuestasRonda()[U.miEquipo];
    if (!r || !r.opcion) return;
    r.enviada = true;
    return render();
  }

  // --- barra de demo (solo Etapa 1) ---
  if (a === "rol") { U.rol = b.dataset.r; return render(); }
  if (a === "reset") { limpiarTimers(); P = null; U = { ...U, pantalla: "home", rol: null, error: "", modoStaff: false, codigoDraft: "" }; return render(); }
});

// Lo que se escribe se guarda sin volver a dibujar la pantalla, para no
// perder el teclado ni el cursor mientras se tipea.
document.addEventListener("input", (ev) => {
  const id = ev.target.id, v = ev.target.value;
  if (id === "codigo") U.codigoDraft = v;
  else if (id === "pin") U.pinDraft = v;
  else if (id === "n-titulo") U.nuevo.titulo = v;
  else if (id === "n-pregunta") U.nuevo.pregunta = v;
  else if (id === "n-texto") U.nuevo.texto = v;
  else if (id === "justi") {
    const r = (respuestasRonda()[U.miEquipo] ||= { opcion: null, justificacion: "", enviada: false });
    if (!r.enviada) r.justificacion = v;
  }
});

render();
</script>
