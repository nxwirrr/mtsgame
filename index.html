<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5f2ea" />
<title>Dictamen · juego de cátedra</title>
<!-- Firebase. Se carga aparte y solo con las piezas que usamos: nada de
     inicio de sesión con Google, que arrastra un archivo de apis.google.com
     capaz de colgar la app en redes con filtros. Si esto no carga, la app
     sigue andando en modo demo. -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { initializeAuth, browserLocalPersistence, signInAnonymously, connectAuthEmulator }
    from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import { getFirestore, connectFirestoreEmulator, doc, collection, query, where,
           getDoc, getDocs, setDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
  window.FB = { initializeApp, initializeAuth, browserLocalPersistence, signInAnonymously,
                connectAuthEmulator, getFirestore, connectFirestoreEmulator, doc, collection,
                query, where, getDoc, getDocs, setDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp };
  window.dispatchEvent(new Event("firebase-listo"));
</script>
<style>
/* ============================================================
   DISEÑO — tokens
   Paleta clara, alto contraste, pensada para leer párrafos
   largos en un celular y para proyectar en un aula.
   ============================================================ */
:root{
  --bg:#f5f2ea;
  --surface:#ffffff;
  --surface-2:#faf8f3;
  --ink:#17151f;
  --ink-2:#3d3850;
  --muted:#726c85;
  --line:#e6e0d4;
  --line-2:#d5cdbc;

  --docente:#4b39d8;
  --docente-soft:#ece9ff;
  --catedra:#b45309;
  --catedra-soft:#fdf1e0;
  --equipo:#0f766e;
  --equipo-soft:#e2f4f1;

  --si:#15803d;
  --si-soft:#e7f6ec;
  --obs:#b45309;
  --obs-soft:#fdf1e0;
  --no:#be123c;
  --no-soft:#fdeaef;

  --r-lg:20px;
  --r-md:14px;
  --r-sm:10px;
  --shadow:0 1px 2px rgba(23,21,31,.06), 0 8px 24px rgba(23,21,31,.07);
  --shadow-sm:0 1px 2px rgba(23,21,31,.07);
  --bar:64px; /* alto de la barra de demo */
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em;font-weight:800}
h1{font-size:26px}
h2{font-size:20px}
h3{font-size:16px;letter-spacing:-.01em}
p{margin:0}

/* ---------- estructura ---------- */
#app{min-height:100dvh;display:flex;flex-direction:column}
.screen{
  flex:1;
  width:min(680px,100%);
  margin:0 auto;
  padding:14px 16px calc(var(--bar) + 28px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:14px;
}
.screen.center{justify-content:center}

/* ---------- barra superior ---------- */
.topbar{
  display:flex;align-items:center;gap:10px;justify-content:space-between;
  padding:2px 0 6px;
}
.rolechip{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:6px 11px;border-radius:999px;border:1px solid transparent;
}
.rolechip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.rolechip.docente{color:var(--docente);background:var(--docente-soft);border-color:#d9d3ff}
.rolechip.catedra{color:var(--catedra);background:var(--catedra-soft);border-color:#f3e0c6}
.rolechip.estudiante{color:var(--equipo);background:var(--equipo-soft);border-color:#c6e7e1}
.codechip{
  font-size:13px;font-weight:700;color:var(--muted);
  letter-spacing:.14em;font-variant-numeric:tabular-nums;
}
.codechip b{color:var(--ink);letter-spacing:.2em}

/* ---------- tarjetas ---------- */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  padding:18px;
  box-shadow:var(--shadow-sm);
}
.card.flat{box-shadow:none;background:var(--surface-2)}
.card.pad-sm{padding:14px}
.kicker{
  font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:7px;
}
.lead{color:var(--ink-2);font-size:15px}
.muted{color:var(--muted);font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.divider{height:1px;background:var(--line);margin:2px 0}

/* ---------- botones ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;padding:14px 18px;border-radius:var(--r-md);
  font-weight:700;font-size:16px;letter-spacing:-.01em;
  background:var(--ink);color:#fff;
  transition:transform .06s ease, opacity .15s ease;
  width:100%;
}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line-2)}
.btn.soft{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.btn.docente{background:var(--docente)}
.btn.catedra{background:var(--catedra)}
.btn.equipo{background:var(--equipo)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px;width:auto;border-radius:var(--r-sm)}
.btn.link{background:none;color:var(--muted);min-height:40px;font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* ---------- formularios ---------- */
label.field{display:block}
.label{
  display:block;font-size:12px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin:0 0 7px;
}
input[type=text],input[type=tel],textarea,select{
  width:100%;background:#fff;border:1.5px solid var(--line-2);
  border-radius:var(--r-md);padding:14px;outline:none;
  transition:border-color .15s ease, box-shadow .15s ease;
}
input:focus,textarea:focus,select:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(23,21,31,.08)}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.code-input{
  text-align:center;font-size:34px;font-weight:800;letter-spacing:.34em;
  text-transform:uppercase;padding:16px 10px 16px 20px;
}
.pin-input{text-align:center;font-size:26px;font-weight:800;letter-spacing:.5em;padding:14px 6px 14px 22px}

/* ---------- fragmento ---------- */
.pregunta{
  background:var(--surface-2);border:1px solid var(--line);
  border-left:4px solid var(--docente);
  border-radius:var(--r-sm);padding:12px 14px;
}
.pregunta .kicker{margin-bottom:4px}
.fragmento{
  font-size:17px;line-height:1.62;color:var(--ink);
  hyphens:auto;
}

/* ---------- opciones ---------- */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
  border:1.5px solid var(--line-2);background:#fff;border-radius:var(--r-md);
  padding:15px 14px;transition:border-color .12s ease, background .12s ease;
}
.opt .badge{
  flex:0 0 auto;width:28px;height:28px;border-radius:8px;
  display:grid;place-items:center;font-weight:800;font-size:14px;
  background:var(--surface-2);color:var(--muted);border:1px solid var(--line);
}
.opt .txt{font-weight:700;letter-spacing:-.01em}
.opt[aria-pressed=true]{border-width:2px;padding:14px 13px}
.opt.si[aria-pressed=true]{border-color:var(--si);background:var(--si-soft)}
.opt.si[aria-pressed=true] .badge{background:var(--si);color:#fff;border-color:var(--si)}
.opt.obs[aria-pressed=true]{border-color:var(--obs);background:var(--obs-soft)}
.opt.obs[aria-pressed=true] .badge{background:var(--obs);color:#fff;border-color:var(--obs)}
.opt.no[aria-pressed=true]{border-color:var(--no);background:var(--no-soft)}
.opt.no[aria-pressed=true] .badge{background:var(--no);color:#fff;border-color:var(--no)}

.tag{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:800;letter-spacing:.02em;
  padding:5px 10px;border-radius:999px;border:1px solid transparent;white-space:nowrap;
}
.tag.si{color:var(--si);background:var(--si-soft);border-color:#c7e6d2}
.tag.obs{color:var(--obs);background:var(--obs-soft);border-color:#f3e0c6}
.tag.no{color:var(--no);background:var(--no-soft);border-color:#f6ccd7}
.tag.gris{color:var(--muted);background:var(--surface-2);border-color:var(--line)}

/* ---------- cronómetro ---------- */
.timer{display:flex;align-items:center;gap:12px}
.timer .num{
  font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;min-width:76px;
}
.timer.urgente .num{color:var(--no)}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ink);transition:width .95s linear}
.timer.urgente .bar > i{background:var(--no)}

/* ---------- listas ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{
  display:flex;align-items:center;gap:12px;
  border:1px solid var(--line);border-radius:var(--r-md);
  background:#fff;padding:12px 14px;
}
.item .name{font-weight:700}
.row.wrap .name{white-space:nowrap}
.item .sub{font-size:13px;color:var(--muted)}
.avatar{
  flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  font-weight:800;font-size:13px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);
}
.avatar.e1{background:#e8ecff;border-color:#cdd6ff;color:#3346c7}
.avatar.e2{background:#e2f4f1;border-color:#c1e6df;color:#0f766e}
.avatar.e3{background:#fdf1e0;border-color:#f2ddbf;color:#b45309}
.avatar.e4{background:#fdeaef;border-color:#f5ccd8;color:#be123c}

/* ---------- puntajes ---------- */
.scorebtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sbtn{
  border:1.5px solid var(--line-2);background:#fff;border-radius:var(--r-md);
  min-height:52px;font-weight:800;font-size:17px;
  display:grid;place-items:center;transition:all .12s ease;
}
.sbtn small{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.sbtn[aria-pressed=true]{background:var(--catedra);border-color:var(--catedra);color:#fff}
.sbtn[aria-pressed=true] small{color:#fff;opacity:.85}

.rank{display:flex;flex-direction:column;gap:8px}
.rank .item .pos{font-weight:800;color:var(--muted);width:22px;text-align:center}
.rank .item .pts{font-weight:800;font-variant-numeric:tabular-nums;font-size:18px}
.rank .item.yo{border-color:var(--equipo);background:var(--equipo-soft)}

.big-code{
  text-align:center;padding:22px 16px;
  background:var(--ink);color:#fff;border-radius:var(--r-lg);
}
.big-code .val{font-size:48px;font-weight:800;letter-spacing:.22em;line-height:1.1}
.big-code .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.65;font-weight:700}
.big-code .pin{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18);font-size:13px;opacity:.8}
.big-code .pin b{font-size:19px;letter-spacing:.18em;opacity:1}

.wait{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  text-align:center;padding:34px 18px;
}
.pulse{width:52px;height:52px;border-radius:50%;background:var(--ink);opacity:.12;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.82);opacity:.1}50%{transform:scale(1);opacity:.22}}

.progress-dots{display:flex;gap:6px;justify-content:center}
.progress-dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.progress-dots i.on{background:var(--ink)}
.progress-dots i.now{background:var(--docente);transform:scale(1.35)}

.check{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;border:1.5px solid var(--line-2);border-radius:var(--r-md);background:#fff;text-align:left;width:100%}
.check[aria-pressed=true]{border-color:var(--docente);background:var(--docente-soft)}
.check .box{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line-2);background:#fff;display:grid;place-items:center;font-size:13px;color:#fff;font-weight:800;margin-top:1px}
.check[aria-pressed=true] .box{background:var(--docente);border-color:var(--docente)}
.check .t{font-weight:700;font-size:15px}
.check .d{font-size:13px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface-2);padding:5px;border-radius:var(--r-md);border:1px solid var(--line)}
.seg button{padding:10px 6px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
.seg.seg-6{grid-template-columns:repeat(6,1fr)}
.fila-frag{position:relative}
.fila-frag .check{padding-right:74px}
.fila-frag .editar{position:absolute;top:6px;right:8px;min-height:32px;font-size:13px;padding:0 6px}

.aviso{
  display:flex;gap:10px;align-items:flex-start;
  background:var(--catedra-soft);border:1px solid #f3e0c6;color:#7c3d06;
  border-radius:var(--r-md);padding:12px 14px;font-size:13px;line-height:1.45;
}

/* ---------- fichas de actividad ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1.5px solid var(--line-2);background:#fff;color:var(--ink-2);
  border-radius:999px;padding:9px 15px;font-size:14px;font-weight:600;min-height:40px;
}
.chip[aria-pressed=true]{border-color:var(--docente);background:var(--docente-soft);color:var(--docente)}
.chip.mas{font-size:19px;font-weight:700;padding:9px 16px;color:var(--docente);border-style:dashed}

/* ---------- opciones de un ítem ---------- */
.fila-opcion{display:flex;align-items:center;gap:8px}
.fila-opcion .op-texto{flex:1;padding:10px 12px;border-radius:var(--r-sm)}
.tilde{
  flex:0 0 auto;width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line-2);
  background:#fff;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px;
}
.tilde[aria-pressed=true]{background:var(--si);border-color:var(--si)}
.fila-opcion .quitar{min-height:34px;font-size:12px;padding:0 4px;flex:0 0 auto}

.marca{
  font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap;
}
.marca.bien{color:var(--si);background:var(--si-soft);border-color:#c7e6d2}
.marca.mal{color:var(--muted);background:var(--surface-2);border-color:var(--line)}

.opt.neutro[aria-pressed=true]{border-color:var(--docente);background:var(--docente-soft)}
.opt.neutro[aria-pressed=true] .badge{background:var(--docente);color:#fff;border-color:var(--docente)}

/* ---------- avisos pasajeros ---------- */
.avisos{
  position:fixed;left:0;right:0;bottom:calc(var(--bar) + env(safe-area-inset-bottom));
  z-index:60;display:flex;flex-direction:column;gap:8px;
  padding:0 14px 12px;pointer-events:none;
}
.toast{
  background:var(--ink);color:#fff;border-radius:var(--r-md);
  padding:13px 15px;font-size:14px;line-height:1.45;font-weight:500;
  box-shadow:0 8px 30px rgba(23,21,31,.28);
  width:min(560px,100%);margin:0 auto;
}
.toast.problema{background:var(--no)}
.toast.red{background:#4a4360}

/* ---------- barra de demo (solo etapa 1) ---------- */
.demobar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(23,21,31,.96);
  backdrop-filter:saturate(140%) blur(8px);
  color:#fff;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:8px;
}
.demobar .lbl{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.55;padding-right:2px;line-height:1.2;max-width:74px}
.demobar .segs{display:flex;gap:6px;flex:1}
.demobar button{
  flex:1;padding:10px 6px;border-radius:10px;font-size:13px;font-weight:700;
  background:rgba(255,255,255,.1);color:#fff;
}
.demobar button[aria-pressed=true]{background:#fff;color:var(--ink)}
.demobar button.reset{flex:0 0 auto;background:none;opacity:.55;font-size:12px;text-decoration:underline;padding:10px 4px}

@media (min-width:560px){
  h1{font-size:30px}
  .screen{padding-left:20px;padding-right:20px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="avisos" id="avisos"></div>
<div class="demobar" id="demobar"></div>
<script>
/* ============================================================================
   ETAPA 1 — Esqueleto navegable, SIN base de datos.

   Todo lo que acá se guarda en la variable `P` ("la partida") es, en la
   Etapa 2, lo que va a vivir en el pizarrón compartido (Firestore). El
   código está escrito para que ese cambio sea reemplazar cómo se lee y se
   escribe `P`, sin tocar las pantallas.

   Por ahora vive solo en la memoria de esta pestaña: si recargás, se borra.
   La barra negra de abajo es SOLO de esta etapa: sirve para ver las tres
   interfaces de la misma partida desde un único celular.
   ============================================================================ */

/* ---------------------------------------------------------------- DATOS --- */

// Las 3 opciones son siempre las mismas. Lo que cambia por tipo de actividad
// es el criterio de puntaje que ve cátedra (ver TIPOS).
/* ─── Formatos de respuesta ───────────────────────────────────────────────
   Cada actividad elige cómo responde el equipo. Dictamen y verdadero o falso
   traen sus opciones fijas; en opción múltiple las escribe quien carga cada
   ítem, y ahí mismo marca cuál o cuáles son correctas. */
const FORMATOS = {
  dictamen: {
    nombre: "Dictamen",
    ayuda: "Aprueba · Aprueba con observaciones · No aprueba",
    fijas: [
      { id: "aprueba",       letra: "A", clase: "si",  texto: "Aprueba" },
      { id: "observaciones", letra: "B", clase: "obs", texto: "Aprueba con observaciones" },
      { id: "no_aprueba",    letra: "C", clase: "no",  texto: "No aprueba" }
    ]
  },
  vf: {
    nombre: "Verdadero o falso",
    ayuda: "Dos opciones fijas",
    fijas: [
      { id: "v", letra: "V", clase: "si", texto: "Verdadero" },
      { id: "f", letra: "F", clase: "no", texto: "Falso" }
    ]
  },
  opciones: {
    nombre: "Opción múltiple",
    ayuda: "Las opciones se escriben en cada ítem; podés marcar una o varias correctas",
    fijas: null
  }
};
const FORMATO_IDS = Object.keys(FORMATOS);
const LETRAS = "ABCDEFGHIJ";

const formatoDe = (algo) => FORMATOS[algo?.formato] ? algo.formato : "dictamen";

// Las opciones que se le muestran al equipo para un ítem dado.
function opcionesVisibles(item, formato) {
  const f = FORMATOS[formato] || FORMATOS.dictamen;
  if (f.fijas) return f.fijas;
  return (item?.opciones || []).map((o, i) => ({
    id: o.id, letra: LETRAS[i] || "·", clase: "neutro", texto: o.texto
  }));
}

// Cuál o cuáles son las correctas, para que cátedra las tenga de referencia.
function correctasDe(item, formato) {
  if (!item) return [];
  if (formato === "opciones") return (item.opciones || []).filter((o) => o.correcta).map((o) => o.id);
  return item.esperada ? [item.esperada] : [];
}
const permiteVarias = (item, formato) => formato === "opciones" && correctasDe(item, formato).length > 1;

/* ─── Actividades ─────────────────────────────────────────────────────────
   Estas tres son el punto de partida. Cada cátedra las edita y crea las
   propias desde la aplicación; lo que se guarda reemplaza a esta lista. */
const TIPOS_BASE = {
  fragmento: {
    nombre: "Evaluación de fragmento",
    corto: "Fragmento",
    consigna: "Leé el fragmento y dictaminá.",
    formato: "dictamen",
    criterio: {
      2: "Fundamenta con criterios del texto y justifica el fallo.",
      1: "Identifica el problema pero la justificación es general.",
      0: "No justifica o la justificación no se apoya en el fragmento."
    }
  },
  estado: {
    nombre: "Estado de la cuestión",
    corto: "Estado",
    consigna: "¿El párrafo construye estado de la cuestión?",
    formato: "dictamen",
    criterio: {

  if (window.FB) return Promise.resolve(true);
  return new Promise((listo) => {

function escucharSala(codigo) {
  dejarDeEscuchar();
  cortar.push(window.FB.onSnapshot(refSala(codigo), (d) => {
    if (!d.exists()) {
      // La sala se cerró: cortamos todas las escuchas antes de que fallen.
      dejarDeEscuchar();
      P = null; R = {}; PT = {}; J = [];
      U.pantalla = "home"; U.rol = null; U.pin = "";
      U.error = "La partida se cerró.";
      olvidarSesion();
      return render();
    }
    P = d.data();
    recomponerEquipos();
    latido();
    render();
  }));
  cortar.push(window.FB.onSnapshot(refJugadores(codigo), (snap) => {
    J = snap.docs.map((d) => ({ uid: d.id, ...d.data() }));
    medirDesfase(J);
    recomponerEquipos();
    render();
  }));
  /* Cátedra y quien dicta la clase escuchan todas las respuestas. Un equipo
     escucha únicamente la suya: así no hay manera de espiar lo que contestó
     otro equipo mientras la ronda está abierta, ni desde la pantalla ni
     desde las herramientas del navegador. */
  const soyStaff = U.rol === "docente" || U.rol === "catedra";

// Sorteo: al equipo con menos gente. Si ya entré antes, vuelvo al mío.
async function sumarmeALaSala(codigo, rol, nombre, cuantosEquipos = 4) {
  const FB = window.FB;
  const ref = refJugador(codigo, miUid);
  const mio = await FB.getDoc(ref);
  sondaT0 = Date.now();
  if (mio.exists() && mio.data().equipoId) {
    await FB.updateDoc(ref, { rol, nombre: nombre || mio.data().nombre || "", visto: Date.now(),
                              sonda: FB.serverTimestamp() });
    return mio.data().equipoId;
  }
  let equipoId = null;
  if (rol === "estudiante") {
    const snap = await FB.getDocs(FB.query(refJugadores(codigo), FB.where("rol", "==", "estudiante")));
    const cuenta = {};
    const equipos = equiposBase(cuantosEquipos);
    equipos.forEach((e) => (cuenta[e.id] = 0));
    snap.forEach((d) => { const e = d.data().equipoId; if (e in cuenta) cuenta[e]++; });
    equipoId = equipos.map((e) => e.id).sort((a, b) => cuenta[a] - cuenta[b])[0];
  }
  sondaT0 = Date.now();
  await FB.setDoc(ref, { rol, nombre: nombre || "", equipoId, visto: Date.now(),
                         sonda: FB.serverTimestamp() });
  return equipoId;
}

/* Cerrar la partida borra la sala y lo que quedó colgando de ella. Quien
   la tenga abierta vuelve al inicio solo. */
async function cerrarPartida(partida) {
  if (!MODO_NUBE || !db || !partida) { olvidarSesion(); return; }
  const FB = window.FB, cod = partida.codigo;
  const colecciones = ["jugadores", "respuestas", "puntajes", "staff"];
  for (const nombre of colecciones) {
    try {
      const snap = await FB.getDocs(FB.collection(db, "salas", cod, nombre));
      await Promise.all(snap.docs.map((d) => FB.deleteDoc(d.ref).catch(() => {})));
    } catch (e) { /* si no se puede borrar algo, la sala igual se cierra */ }
  }
  try { await FB.deleteDoc(refPrivado(cod)); } catch (e) {}
  await pase(FB.deleteDoc(refSala(cod)), "No pudimos cerrar la partida. Probá de nuevo.");
  dejarDeEscuchar();
  olvidarSesion();
}

async function cargarTipos() {
  let guardado = null;
  if (MODO_NUBE && db) {
    const d = await window.FB.getDoc(window.FB.doc(db, "config", "tipos"));
    guardado = d.exists() ? d.data() : null;
  } else {
    try { guardado = JSON.parse(localStorage.getItem(LLAVE_TIPOS) || "null"); } catch (e) {}
  }
  TIPOS = clonar(TIPOS_BASE);
  if (guardado && Array.isArray(guardado.lista)) {
    // Formato nuevo: la lista completa, con las actividades propias incluidas.
    TIPOS = {};
    guardado.lista.forEach((a) => {
      if (!a || !a.id) return;
      TIPOS[a.id] = {
        nombre: a.nombre || "Actividad",
        corto: a.corto || (a.nombre || "Actividad").slice(0, 12),
        consigna: a.consigna || "",
        formato: FORMATOS[a.formato] ? a.formato : "dictamen",
        criterio: { 2: a.criterio?.[2] || "", 1: a.criterio?.[1] || "", 0: a.criterio?.[0] || "" },
        propia: !!a.propia
      };
    });
    if (!Object.keys(TIPOS).length) TIPOS = clonar(TIPOS_BASE);
  } else if (guardado) {
    // Formato viejo: eran solo retoques sobre las tres de fábrica.
    Object.keys(TIPOS).forEach((t) => {
      const g = guardado[t];
      if (!g) return;
      if (g.nombre) TIPOS[t].nombre = g.nombre;
      if (g.corto) TIPOS[t].corto = g.corto;
      if (g.consigna) TIPOS[t].consigna = g.consigna;
      if (g.criterio) [2, 1, 0].forEach((n) => { if (g.criterio[n]) TIPOS[t].criterio[n] = g.criterio[n]; });
    });
  }
  refrescarIds();
  if (!TIPOS[cfg.tipo]) cfg.tipo = TIPO_IDS[0];
}

function set(cambios) {

      "No pudimos actualizar la partida. Revisá la conexión.");

  Object.entries(cambios).forEach(([ruta, valor]) => {

    let o = P;
    for (let i = 0; i < partes.length - 1; i++) o = (o[partes[i]] ||= {});
    o[partes[partes.length - 1]] = valor;
  });
  render();
}

const uid = () => Math.random().toString(36).slice(2, 8);
const azar = (n) => Math.floor(Math.random() * n);

/* Huella del PIN. La partida guarda la huella, no el PIN: así una estudiante
   curiosa no lo lee en el documento. La comprobación seria la hacen las
   reglas de seguridad contra un documento que nadie puede leer. */
function huella(txt) {
  let h = 2166136261;
  for (const c of String(txt)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}

/* Dos partidas con el mismo código dejarían a una clase entera adentro de
   la sala equivocada. Antes de crearla, comprobamos que el código esté libre. */
async function codigoLibre() {
  if (!MODO_NUBE || !db) return codigoSala();
  for (let i = 0; i < 25; i++) {
    const c = codigoSala();
    const d = await window.FB.getDoc(refSala(c));
    if (!d.exists()) return c;
  }
  return null;                       // antes que pisar una sala ajena, no creamos
}

function codigoSala() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return Array.from({ length: 4 }, () => chars[azar(chars.length)]).join("");
}
function mmss(seg) {
  const s = Math.max(0, Math.round(seg));
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
function limpiarTimers() {
  clearInterval(tick); tick = null;
  demoTimers.forEach(clearTimeout); demoTimers = [];
}

async function crearPartida() {
  if (nubeLista) await nubeLista;
  const rondas = cfg.elegidos
    .map((id) => BIBLIOTECA.find((x) => x.id === id))
    .filter(Boolean)
    .map((f) => ({
      titulo: f.titulo, pregunta: f.pregunta || "", texto: f.texto,
      esperada: f.esperada || null,
      opciones: (f.opciones || []).map((o) => ({ id: o.id, texto: o.texto, correcta: !!o.correcta }))
    }));
  if (!rondas.length) { U.error = "Elegí al menos un fragmento."; return render(); }
  const pin = String(1000 + azar(9000));
  const codigo = await codigoLibre();
  if (!codigo) { avisar("No pudimos crear la sala. Probá de nuevo."); return; }
  const partida = {
    codigo,
    pinHuella: huella(pin),
    tipo: cfg.tipo,
    tipoNombre: TIPOS[cfg.tipo].nombre,
    formato: formatoDe(TIPOS[cfg.tipo]),
    criterio: clonar(TIPOS[cfg.tipo].criterio),
    segundos: cfg.segundos,
    cantidadEquipos: cfg.equipos,
    rondas,
    rondaIndex: 0,
    fase: "lobby",              // lobby | ronda | puntuando | revelado | fin
    finRonda: null
  };

  U.pin = pin;
  if (MODO_NUBE) {
    partida.creador = miUid;
    await window.FB.setDoc(refSala(partida.codigo), partida);
    await window.FB.setDoc(refPrivado(partida.codigo), { pin });
    await sumarmeALaSala(partida.codigo, "docente", "", partida.cantidadEquipos);
    U.rol = "docente";
    U.miEquipo = null;
    U.pantalla = "partida";
    recordarSesion(partida.codigo, "docente");
    escucharSala(partida.codigo);
    return render();
  }

  // Modo demo: equipos inventados para poder recorrer las pantallas.
  partida.equipos = equiposDe(partida).map((e) => ({ ...e, integrantes: [] }));
  const cuantos = partida.equipos.length;
  NOMBRES_DEMO.slice(0, cuantos * 3 - 1).forEach((nom, i) => partida.equipos[i % cuantos].integrantes.push(nom));
  P = partida;
  R = {}; PT = {};
  U.rol = "docente";
  U.miEquipo = "e2";            // en la demo, "yo estudiante" soy del Equipo 2
  U.pantalla = "partida";
  render();
}

const claveRonda = () => "r" + P.rondaIndex;
const opcionesRonda = () => opcionesVisibles(fragmentoActual(), formatoDe(P));
const correctasRonda = () => correctasDe(fragmentoActual(), formatoDe(P));
const variasRonda = () => permiteVarias(fragmentoActual(), formatoDe(P));
const elegidasDe = (r) => (r && (r.elegidas || (r.opcion ? [r.opcion] : []))) || [];
const fragmentoActual = () => P.rondas[P.rondaIndex] || null;
const respuestasRonda = () => R[claveRonda()] || {};
const puntajesRonda = () => PT[claveRonda()] || {};
const respuestaDe = (eq) => respuestasRonda()[eq] || null;

function totalDe(equipoId) {
  return Object.values(PT).reduce((acc, r) => acc + (r[equipoId] ?? 0), 0);
}
/* Si vinieron doce personas y la partida se armó para seis equipos, los
   equipos vacíos no tienen que aparecer esperando respuesta ni frenar la
   revelación del puntaje. Solo juegan los que tienen gente. */
function equiposActivos() {
  const conGente = P.equipos.filter((e) => e.integrantes.length > 0);
  return conGente.length ? conGente : P.equipos;
}
function ranking() {
  return equiposActivos()
    .map((e) => ({ ...e, total: totalDe(e.id) }))
    .sort((a, b) => b.total - a.total || a.nombre.localeCompare(b.nombre));
}
function respondidos() {
  return equiposActivos().filter((e) => respuestaDe(e.id)?.enviada).length;
}
function cuantosJuegan() { return equiposActivos().length; }
function puntuados() {
  const p = puntajesRonda();
  return equiposActivos().filter((e) => p[e.id] !== undefined).length;
}

function iniciarRonda() {
  limpiarTimers();
  const k = claveRonda();
  cerrando = false;
  vencimientoAtendido = null;
  delete R[k]; delete PT[k];         // si se repite la ronda, arranca limpia
  const marca = MODO_NUBE && window.FB ? window.FB.serverTimestamp() : null;
  set(marca
    ? { fase: "ronda", finRonda: Date.now() + P.segundos * 1000, inicioServidor: marca }
    : { fase: "ronda", finRonda: Date.now() + P.segundos * 1000 });
  arrancarLatido();
  if (!MODO_NUBE) demoOtrosEquiposResponden();
}

// Cada dispositivo lleva su propio reloj de pantalla; el fin de la ronda es
// una hora fija guardada en la sala, así todos ven el mismo número.
function arrancarLatido() {
  clearInterval(tick);
  tick = setInterval(latido, 250);
}

/* El cronómetro no puede depender del reloj de cada celular: si uno está
   atrasado, esa persona ve otro número. Al entrar, cada dispositivo escribe
   una marca con la hora del servidor y, cuando le vuelve resuelta, calcula
   cuánto se desvía su propio reloj. Con eso, todos cuentan contra la misma
   hora, y quien entra a mitad de la ronda recibe el tiempo que queda. */
function medirDesfase(snapshotJugadores) {
  if (desfaseReloj !== null || sondaT0 === null) return;
  const mio = snapshotJugadores.find((j) => j.uid === miUid);
  const sonda = mio && mio.sonda;
  if (!sonda || typeof sonda.toMillis !== "function") return;   // todavía sin confirmar
  desfaseReloj = sonda.toMillis() - sondaT0;
}

const ahoraServidor = () => Date.now() + (desfaseReloj || 0);

function restanteSeg() {
  if (desfaseReloj !== null && P.inicioServidor?.toMillis) {
    return (P.inicioServidor.toMillis() + P.segundos * 1000 - ahoraServidor()) / 1000;
  }
  return (P.finRonda - Date.now()) / 1000;                      // respaldo
}

function latido() {
  if (!P || P.fase !== "ronda") { clearInterval(tick); tick = null; cerrando = false; return; }
  if (!tick) arrancarLatido();
  const restante = restanteSeg();
  pintarTimer(restante);
  if (restante > 0) return;

  // Al vencer el tiempo cada equipo manda una sola vez lo que tenga escrito.
  if (vencimientoAtendido !== claveRonda()) {
    vencimientoAtendido = claveRonda();
    if (U.rol === "estudiante" && U.miEquipo && !respuestaDe(U.miEquipo)?.enviada) {
      guardarRespuesta(U.miEquipo, {
        elegidas: U.borrador.elegidas, justificacion: U.borrador.justificacion, enviada: true, vencida: true });
    }
  }

  /* Cierra quien dicta la clase. Si su celular está dormido o sin señal, a
     los cuatro segundos cierra cátedra: la ronda no puede quedar colgada
     esperando un dispositivo. */
  if (cerrando) return;
  const meToca = !MODO_NUBE || U.rol === "docente" || (U.rol === "catedra" && restante <= -4);
  if (meToca) { cerrando = true; cerrarRonda(); }
}

function cerrarRonda() {
  limpiarTimers();
  // Lo que no llegó a enviarse se cierra como vencido, para que cátedra vea
  // los cuatro equipos y no tres.
  const pendientes = equiposActivos().filter((e) => !respuestaDe(e.id)?.enviada).map((e) => {
    const r = respuestaDe(e.id);
    return guardarRespuesta(e.id, {
      elegidas: elegidasDe(r), justificacion: r?.justificacion ?? "", enviada: true, vencida: true });
  });
  set({ fase: "puntuando", finRonda: null });
  return Promise.all(pendientes.filter(Boolean));
}

function siguienteRonda() {
  if (P.rondaIndex + 1 < P.rondas.length) set({ rondaIndex: P.rondaIndex + 1, fase: "lobby" });
  else set({ fase: "fin" });
}

// Solo en modo demo: los otros equipos contestan solos para poder ver cómo
// se llena la pantalla de quien dicta la clase.
function demoOtrosEquiposResponden() {
  P.equipos.filter((e) => e.id !== U.miEquipo).forEach((e) => {
    const cuando = 4000 + azar(Math.max(3000, P.segundos * 1000 - 12000));
    demoTimers.push(setTimeout(() => {
      if (!P || P.fase !== "ronda") return;
      const posibles = opcionesRonda();
      guardarRespuesta(e.id, {
        elegidas: posibles.length ? [posibles[azar(posibles.length)].id] : [],
        justificacion: "El párrafo enumera autores pero no articula la teoría con el problema de investigación.",
        enviada: true, vencida: false });
    }, cuando));
  });
}

function timerHTML() {
  const restante = P.finRonda ? restanteSeg() : P.segundos;
  const pct = Math.max(0, Math.min(100, (restante / P.segundos) * 100));
  const urg = restante <= 15 ? " urgente" : "";
  return `<div class="timer${urg}" id="timer">
    <span class="num" id="tnum">${mmss(restante)}</span>
    <span class="bar"><i id="tbar" style="width:${pct}%"></i></span>
  </div>`;
}
function pintarTimer(restante) {
  const num = document.getElementById("tnum"), bar = document.getElementById("tbar"), box = document.getElementById("timer");
  if (!num) return;
  num.textContent = mmss(restante);
  bar.style.width = Math.max(0, Math.min(100, (restante / P.segundos) * 100)) + "%";
  box.classList.toggle("urgente", restante <= 15);
}

function tagsRespuesta(r, opciones) {
  const elegidas = elegidasDe(r);
  if (!elegidas.length) {
    return `<span class="tag gris">${r?.vencida ? "Sin responder" : "—"}</span>`;
  }
  return elegidas.map((id) => {
    const o = (opciones || []).find((x) => x.id === id);
    return o ? `<span class="tag ${o.clase}">${esc(o.texto)}</span>`
             : `<span class="tag gris">opción borrada</span>`;
  }).join(" ");
}

// Referencia para cátedra: qué se esperaba y si el equipo coincidió.
function referenciaHTML() {
  const correctas = correctasRonda();
  if (!correctas.length) return "";
  const opciones = opcionesRonda();
  const textos = correctas.map((id) => (opciones.find((o) => o.id === id) || {}).texto || "?");
  return `<div class="card flat stack-sm">
    <p class="kicker">${correctas.length > 1 ? "Respuestas correctas" : "Respuesta esperada"}</p>
    <p class="lead">${textos.map((t) => esc(t)).join(" · ")}</p>
  </div>`;
}

function coincideHTML(r) {
  const correctas = correctasRonda();
  if (!correctas.length) return "";
  const elegidas = elegidasDe(r);
  if (!elegidas.length) return "";
  const iguales = correctas.length === elegidas.length && correctas.every((c) => elegidas.includes(c));
  return `<span class="marca ${iguales ? "bien" : "mal"}">${iguales ? "coincide" : "no coincide"}</span>`;
}

  return `<div class="rank">${ranking().map((e, i) => `

/* --------------------------------------------------------------- ENTRAR --- */

async function entrar() {
  const cod = (U.codigoDraft || "").trim().toUpperCase();
  if (nubeLista) { U.error = ""; await nubeLista; }
  if (cod.length < 4) { U.error = "Escribí el código de 4 letras."; return render(); }

  if (!MODO_NUBE) {
    if (!P) {
      U.error = "En esta pestaña no hay ninguna partida abierta. Todavía no hay base de datos compartida, así que un código creado en otro celular no se puede encontrar. Para ver los otros roles de una partida creada acá, usá la barra negra de abajo.";
      return render();
    }
    if (cod !== P.codigo) { U.error = "No encontramos esa sala. Revisá el código."; return render(); }
    if (U.modoStaff) {
      if (huella(U.pinDraft.trim()) !== P.pinHuella) { U.error = "PIN incorrecto."; return render(); }
      U.rol = "catedra";
    } else {
      U.rol = "estudiante";
      U.miEquipo = U.miEquipo || "e2";
    }
    U.error = ""; U.pantalla = "partida"; return render();
  }

  U.error = "Buscando la sala…"; render();
  try {
    const sala = await window.FB.getDoc(refSala(cod));
    if (!sala.exists()) { U.error = "No encontramos esa sala. Revisá el código."; return render(); }
    if (U.modoStaff) {
      if (huella(U.pinDraft.trim()) !== sala.data().pinHuella) { U.error = "PIN incorrecto."; return render(); }
      // Las reglas de seguridad rechazan este documento si el PIN no coincide:
      // es la comprobación que no se puede esquivar desde el navegador.
      try {
        await window.FB.setDoc(refStaff(cod, miUid), { pin: U.pinDraft.trim() });
      } catch (e) {
        U.error = "PIN incorrecto."; return render();
      }
    }

    const rol = U.modoStaff ? "catedra" : "estudiante";
    U.miEquipo = await sumarmeALaSala(cod, rol, U.nombreDraft.trim(), sala.data().cantidadEquipos || 4);
    U.rol = rol; U.error = ""; U.pantalla = "partida";
    recordarSesion(cod, rol);
    escucharSala(cod);
    render();
  } catch (e) {
    U.error = "No pudimos conectarnos. Revisá internet y probá de nuevo.";
    render();
  }
}

/* ---------------------------------------------------------------- RENDER --- */

function render() {
  if (P && U.borradorDe !== (P.rondaIndex ?? null)) {
    U.borradorDe = P.rondaIndex ?? null;
    U.borrador = { elegidas: [], justificacion: "" };
  }
  const activo = document.activeElement;
  const foco = activo && activo.id ? { id: activo.id, pos: activo.selectionStart } : null;

  let html;
  if (U.pantalla === "actividad") html = vistaActividad();
  else if (U.pantalla === "crear") html = vistaCrear();
  else if (U.pantalla === "home" || !P) html = vistaHome();
  else html = { docente: vistaDocente, catedra: vistaCatedra, estudiante: vistaEstudiante }[U.rol]();
  $("#app").innerHTML = html;

  $("#avisos").innerHTML =
    (U.nubeCaida ? `<div class="toast problema">No pudimos conectarnos con la base de datos.
      Esta partida <b>no se comparte</b> con otros celulares. Recargá la página para reintentar.</div>` : "") +
    (U.sinRed ? `<div class="toast red">Sin conexión. La partida se pone al día cuando vuelva internet.</div>` : "") +
    (U.aviso ? `<div class="toast problema">${esc(U.aviso)}</div>` : "");

  if (foco) {
    const el = document.getElementById(foco.id);
    if (el) { el.focus(); try { el.setSelectionRange(foco.pos, foco.pos); } catch (_) {} }
  }
  renderDemobar();
}

function renderDemobar() {
  const barra = $("#demobar");
  if (MODO_NUBE) {                       // con base de datos compartida no hace falta
    document.documentElement.style.setProperty("--bar", "0px");
    barra.style.display = "none";
    return;
  }
  /* Volver a mostrarla importa: si la app arrancó apuntando a la nube y no
     pudo conectarse, queda en modo demo y necesita la barra de nuevo. */
  document.documentElement.style.removeProperty("--bar");
  barra.style.display = "";
  const roles = [["docente", "Docente"], ["catedra", "Cátedra"], ["estudiante", "Estudiante"]];
  $("#demobar").innerHTML = !P || U.pantalla !== "partida"
    ? `<span class="lbl" style="max-width:none">Modo demostración · una sola pantalla</span>`
    : `<span class="lbl">Ver como</span>
       <span class="segs">${roles.map(([r, t]) =>
         `<button data-a="rol" data-r="${r}" aria-pressed="${U.rol === r}">${t}</button>`).join("")}</span>
       <button class="reset" data-a="reset">Reiniciar</button>`;
}

/* ---------------------------------------------------------------- EVENTOS --- */

document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-a]");
  if (!b) return;
  const a = b.dataset.a;

  // --- inicio ---
  if (a === "toggle-staff") { U.modoStaff = !U.modoStaff; U.error = ""; return render(); }
  if (a === "ir-crear") { U.pantalla = "crear"; U.error = ""; return render(); }
  if (a === "demo-rapida") {           // partida armada, para mostrar la idea sin configurar
    const ejemplos = BIBLIOTECA.filter((f) => f.tipo === "estado").slice(0, 2);
    cfg = { tipo: "estado", segundos: 90, equipos: 4, elegidos: ejemplos.map((f) => f.id) };
    return crearPartida();
  }
  if (a === "cerrar-partida") {
    const copia = P;
    P = null; R = {}; PT = {}; U.pantalla = "home"; U.rol = null; U.pin = "";
    render();
    return cerrarPartida(copia);
  }
  if (a === "home") {
    dejarDeEscuchar(); olvidarSesion();
    U.pantalla = "home"; U.rol = null; U.error = ""; U.modoStaff = false; U.pin = "";
    return render();
  }
  if (a === "entrar") return entrar();

  // --- armado de la partida ---
  if (a === "tipo") {
    cfg.tipo = b.dataset.t;
    if (U.pantalla !== "criterios") cfg.elegidos = [];
    return render();
  }
  if (a === "tiempo") { cfg.segundos = Number(b.dataset.s); return render(); }
  if (a === "elegir") {
    const id = b.dataset.f;
    cfg.elegidos = cfg.elegidos.includes(id) ? cfg.elegidos.filter((x) => x !== id) : [...cfg.elegidos, id];
    return render();
  }
  if (a === "equipos") { cfg.equipos = Number(b.dataset.n); return render(); }
  if (a === "ir-actividad") { U.pantalla = "actividad"; U.editando = null; return render(); }
  if (a === "nueva-actividad") {
    cfg.tipo = nuevaActividad();
    cfg.elegidos = [];
    U.pantalla = "actividad"; U.editando = null;
    return render();
  }
  if (a === "formato") {
    TIPOS[cfg.tipo].formato = b.dataset.f;
    return render();
  }
  if (a === "guardar-actividad") {
    const t = TIPOS[cfg.tipo];
    if (!t.nombre.trim()) { avisar("Ponele un nombre a la actividad."); return; }
    t.corto = (t.corto || "").trim() || t.nombre.trim().slice(0, 14);
    U.pantalla = "crear"; render();
    return pase(guardarTipos(), "No pudimos guardar la actividad.");
  }
  if (a === "borrar-actividad") {
    borrarActividad(cfg.tipo);
    U.pantalla = "crear"; render();
    return pase(guardarTipos(), "No pudimos borrar la actividad.");
  }
  if (a === "restaurar-criterios") {
    if (TIPOS_BASE[cfg.tipo]) TIPOS[cfg.tipo] = clonar(TIPOS_BASE[cfg.tipo]);
    render();
    return pase(guardarTipos(), "No pudimos restaurar la actividad.");
  }

  // ── respuesta correcta del ítem ──
  if (a === "esperada") { U.nuevo.esperada = b.dataset.o || null; return render(); }
  if (a === "agregar-opcion") {
    U.nuevo.opciones = [...(U.nuevo.opciones || []), { id: "o" + uid(), texto: "", correcta: false }];
    return render();
  }
  if (a === "quitar-opcion") {
    U.nuevo.opciones = (U.nuevo.opciones || []).filter((o) => o.id !== b.dataset.o);
    return render();
  }
  if (a === "correcta") {
    U.nuevo.opciones = (U.nuevo.opciones || []).map((o) =>
      o.id === b.dataset.o ? { ...o, correcta: !o.correcta } : o);
    return render();
  }
  if (a === "nuevo-frag") {
    U.editando = "nuevo";
    U.nuevo = { titulo: "", pregunta: "", texto: "", esperada: null, opciones: [] };
    return render();
  }
  if (a === "editar-frag") {
    const f = BIBLIOTECA.find((x) => x.id === b.dataset.f);
    if (!f) return;
    U.editando = f.id;
    U.nuevo = {
      titulo: f.titulo, pregunta: f.pregunta || "", texto: f.texto,
      esperada: f.esperada || null,
      opciones: (f.opciones || []).map((o) => ({ ...o }))
    };
    return render();
  }
  if (a === "cancelar-frag") { U.editando = null; return render(); }
  if (a === "guardar-frag") {
    if (!U.nuevo.texto.trim()) { U.error = ""; return; }
    const nuevoId = U.editando === "nuevo";
    const formato = formatoDe(TIPOS[cfg.tipo]);
    const opciones = (U.nuevo.opciones || [])
      .map((o) => ({ id: o.id, texto: (o.texto || "").trim(), correcta: !!o.correcta }))
      .filter((o) => o.texto);
    const f = {
      id: nuevoId ? uid() : U.editando,
      tipo: cfg.tipo,
      titulo: U.nuevo.titulo.trim() || "Ítem sin título",
      pregunta: U.nuevo.pregunta.trim(),
      texto: U.nuevo.texto.trim(),
      esperada: formato === "opciones" ? null : (U.nuevo.esperada || null),
      opciones: formato === "opciones" ? opciones : []
    };
    U.editando = null;
    if (nuevoId && !cfg.elegidos.includes(f.id)) cfg.elegidos.push(f.id);
    render();                                  // no hacemos esperar a la persona
    return guardarFragmento(f).then(render);
  }
  if (a === "borrar-frag") {
    U.editando = null;
    render();
    return borrarFragmento(b.dataset.f).then(render);
  }
  if (a === "crear") return crearPartida();

  // --- control de la partida ---
  if (a === "iniciar") return iniciarRonda();
  if (a === "cortar") return cerrarRonda();
  if (a === "revelar") return set({ fase: "revelado" });
  if (a === "siguiente") return siguienteRonda();
  if (a === "puntuar") return guardarPuntaje(b.dataset.eq, Number(b.dataset.n));

  // --- estudiante ---
  // Lo que el equipo elige y escribe queda en el celular hasta que envía.
  if (a === "opcion") {
    const id = b.dataset.o;
    const ya = U.borrador.elegidas.includes(id);
    if (variasRonda()) {
      U.borrador.elegidas = ya ? U.borrador.elegidas.filter((x) => x !== id) : [...U.borrador.elegidas, id];
    } else {
      U.borrador.elegidas = ya ? [] : [id];
    }
    return render();
  }
  if (a === "enviar") {
    if (!U.borrador.elegidas.length && opcionesRonda().length) return;
    return guardarRespuesta(U.miEquipo, {
      elegidas: U.borrador.elegidas, justificacion: U.borrador.justificacion, enviada: true, vencida: false });
  }

  // --- barra de demo (solo Etapa 1) ---
  if (a === "rol") { U.rol = b.dataset.r; return render(); }
  if (a === "reset") { limpiarTimers(); olvidarSesion(); P = null; R = {}; PT = {}; U = { ...U, pantalla: "home", rol: null, error: "", modoStaff: false, codigoDraft: "" }; return render(); }
});

// Lo que se escribe se guarda sin volver a dibujar la pantalla, para no
// perder el teclado ni el cursor mientras se tipea.
document.addEventListener("input", (ev) => {
  const id = ev.target.id, v = ev.target.value;
  if (id === "codigo") U.codigoDraft = v;
  else if (id === "pin") U.pinDraft = v;
  else if (id === "n-titulo") U.nuevo.titulo = v;
  else if (id === "n-pregunta") U.nuevo.pregunta = v;
  else if (id === "n-texto") U.nuevo.texto = v;
  else if (id === "nombre") U.nombreDraft = v;
  else if (id === "c-nombre") TIPOS[cfg.tipo].nombre = v;
  else if (id === "c-corto") TIPOS[cfg.tipo].corto = v;
  else if (id === "c-consigna") TIPOS[cfg.tipo].consigna = v;
  else if (id === "c-2") TIPOS[cfg.tipo].criterio[2] = v;
  else if (id === "c-1") TIPOS[cfg.tipo].criterio[1] = v;
  else if (id === "c-0") TIPOS[cfg.tipo].criterio[0] = v;
  else if (id === "justi") U.borrador.justificacion = v;
  else if (ev.target.dataset && ev.target.dataset.op) {
    U.nuevo.opciones = (U.nuevo.opciones || []).map((o) =>
      o.id === ev.target.dataset.op ? { ...o, texto: v } : o);
  }
});

// Se dibuja primero y se conecta después: nadie mira una pantalla en blanco
// mientras el celular negocia con la red.
render();
nubeLista = (MODO_NUBE
  ? nubeIniciar().catch((e) => {
      console.error("No se pudo conectar con la base de datos:", e);
      /* Sin nube la aplicación sigue funcionando, pero en un solo
         dispositivo. Cuando hay configuración, eso NO puede pasar en
         silencio: alguien creería estar jugando con el curso y estaría sola. */
      MODO_NUBE = false;
      U.nubeCaida = true;
    })
  : Promise.resolve()
)
  .then(() => Promise.all([cargarBiblioteca(), cargarTipos(), reconectar()]))
  .catch((e) => {
    /* La identidad anónima puede funcionar y la base no responder: cuenta
       sin crear, reglas, o un corte. Sin esto la aplicación se creía
       conectada y no guardaba nada. */
    console.error("La base de datos no respondió al arrancar:", e);
    MODO_NUBE = false;
    U.nubeCaida = true;
    return cargarBiblioteca().catch(() => {});
  })
  .then(render);
</script>
